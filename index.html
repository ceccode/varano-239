<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="%APP_META_DESCRIPTION%" />
    <meta name="theme-color" content="#0a0f26" />
    <meta http-equiv="Content-Security-Policy" content="%APP_CSP%" />
    <title>%APP_TITLE% — %APP_SUBTITLE%</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
  </head>
  <body>
    <main data-app-root class="app-root" aria-label="%APP_TITLE%"></main>

    <div class="static-fallback noscript-shell">
      <p class="eyebrow">%APP_AGE_LABEL%</p>
      <h1>%APP_TITLE%</h1>
      <p class="subtitle">%APP_SUBTITLE%</p>
      <p>%APP_DESCRIPTION%</p>
      <h2>%APP_SAFETY_TITLE%</h2>
      <p>%APP_SAFETY_BODY%</p>
      <h2 id="fonti">%APP_SOURCES_TITLE%</h2>
      <p>%APP_SOURCES_BODY%</p>
      <p>
        <a
          href="https://github.com/ceccode/varano-239/blob/main/docs/SOURCES.md"
          target="_blank"
          rel="noopener noreferrer"
          >%APP_SOURCES_DOCUMENT_LINK%</a
        >
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
