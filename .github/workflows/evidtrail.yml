name: evidtrail

# evidtrail (ADR-038, renamed by ADR-061; formerly AIDA Metrics): an auditable
# evidence ledger of how much of the repository is AI-built and how that code
# holds up. Read-only over git history; the report is informative, never a
# gate — a metrics run must not block a merge.
#
# On pull requests the change set is measured on its own and the report is
# posted as a comment, created once and updated in place. Author identities
# stay redacted.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: evidtrail collect · analyze · report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The whole history: persistence needs to see when files change.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate evidtrail report (default branch)
        if: github.event_name == 'push'
        run: npx evidtrail collect --since 90d --redact-authors && npx evidtrail analyze && npx evidtrail report

      - name: Generate evidtrail report (pull request)
        if: github.event_name == 'pull_request'
        run: npx evidtrail collect --pr --redact-authors && npx evidtrail analyze && npx evidtrail report

      - name: Post evidtrail report comment (pull request)
        # Fork pull requests get a read-only token and cannot comment.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx evidtrail comment

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: evidtrail-report
          path: evidtrail-output/
          if-no-files-found: ignore
          retention-days: 30
