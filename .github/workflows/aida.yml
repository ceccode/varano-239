name: AIDA Metrics

# AI Development Accounting (ADR-038): measures how much of the repository is
# AI-built and how that code holds up. Read-only over git history; the report
# is an artifact, never a gate — a metrics run must not block a merge.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  report:
    name: aida collect · analyze · report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The whole history: persistence needs to see when files change.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate AIDA report
        run: npx aida collect --since 90d --redact-authors && npx aida analyze && npx aida report

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: aida-report
          path: aida-output/
          if-no-files-found: error
          retention-days: 30
