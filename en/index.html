<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="%APP_META_DESCRIPTION%" />
    <link rel="canonical" href="%APP_CANONICAL_URL%" />
    <link rel="alternate" hreflang="it" href="https://app.varano239.it/" />
    <link rel="alternate" hreflang="en" href="https://app.varano239.it/en/" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://app.varano239.it/"
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0a0f26" />
    <meta http-equiv="Content-Security-Policy" content="%APP_CSP%" />
    <meta name="varano-build" content="%APP_BUILD_ID%" />
    <title>%APP_TITLE% — %APP_SUBTITLE%</title>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="it_IT" />
    <meta property="og:site_name" content="%APP_TITLE%" />
    <meta property="og:title" content="%APP_TITLE% — %APP_SUBTITLE%" />
    <meta property="og:description" content="%APP_META_DESCRIPTION%" />
    <meta property="og:url" content="%APP_CANONICAL_URL%" />
    <meta property="og:image" content="%APP_SOCIAL_IMAGE_URL%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%APP_SOCIAL_IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%APP_TITLE% — %APP_SUBTITLE%" />
    <meta name="twitter:description" content="%APP_META_DESCRIPTION%" />
    <meta name="twitter:image" content="%APP_SOCIAL_IMAGE_URL%" />
    <meta name="twitter:image:alt" content="%APP_SOCIAL_IMAGE_ALT%" />
    <link rel="manifest" href="../manifest-en.webmanifest" />
    <link rel="icon" href="../icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
  </head>
  <body>
    <main data-app-root class="app-root" aria-label="%APP_TITLE%"></main>

    <div class="static-fallback noscript-shell">
      <p class="eyebrow">%APP_AGE_LABEL%</p>
      <h1>%APP_TITLE%</h1>
      <p class="subtitle">%APP_SUBTITLE%</p>
      <p>%APP_DESCRIPTION%</p>
      <h2>%APP_SAFETY_TITLE%</h2>
      <p>%APP_SAFETY_BODY%</p>
      <h2 id="sources">%APP_SOURCES_TITLE%</h2>
      <p>%APP_SOURCES_BODY%</p>
      <p>
        <a
          href="https://github.com/ceccode/varano-239/blob/main/docs/SOURCES.md"
          target="_blank"
          rel="noopener noreferrer"
          >%APP_SOURCES_DOCUMENT_LINK%</a
        >
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
